  - url: "{{ _.url_graphql }}"
    name: Profiles — Project sorted (GraphQL)
    meta:
      id: req_f5f0a5b18e0f4a8d9d2b0b7353caa3e2
      created: 1782901400000
      modified: 1782901400000
      isPrivate: false
      description: "Liste les profils d'un projet avec un tri fiable via GraphQL.
        Le REST /profiles accepte orderBy mais le tri observe n'est pas strict avec
        le filtre projectId. Changer order_by selon le besoin : updatedAt, createdAt
        ou passer par profiles_associations pour trier par date d'ajout au projet.
        Clé PRIVÉE."
      sortKey: -1781521431617.5
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "query": "query ProfilesByProject($projectId: uuid!, $limit: Int!, $offset: Int!) { profiles(where: { associations: { projectId: { _eq: $projectId } } }, order_by: { updatedAt: desc }, limit: $limit, offset: $offset) { id createdAt updatedAt firstName lastName headline profileUrl associations(where: { projectId: { _eq: $projectId } }) { id createdAt updatedAt status { id title } projectId } } profiles_aggregate(where: { associations: { projectId: { _eq: $projectId } } }) { aggregate { count } } }",
          "variables": {
            "projectId": "{{ _.showcase_recruiter_webapp_saas_project_uuid }}",
            "limit": 100,
            "offset": 0
          }
        }
    headers:
      - name: User-Agent
        value: insomnia/11.2.0
      - name: Content-Type
        value: application/json
    authentication:
      type: apikey
      key: X-API-KEY
      value: "{{ _.x_api_key }}"
      disabled: false
      addTo: header
    scripts:
      preRequest: ""
      afterResponse: ""
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
