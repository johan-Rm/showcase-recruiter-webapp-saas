    meta:
      id: req_7c58db7c7b5d4d9c9e4e448116cf3917
      created: 1782901400001
      modified: 1782901400001
      isPrivate: false
      description: "Trie les profils par date d'association au projet. Utiliser
        profiles_associations.createdAt pour la date d'ajout au projet, et
        profiles_associations.updatedAt pour la date de changement dans ce projet.
        Clé PRIVÉE."
      sortKey: -1781521431617.4
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "query": "query ProjectProfilesByAssociation($projectId: uuid!, $limit: Int!, $offset: Int!) { profiles_associations(where: { projectId: { _eq: $projectId } }, order_by: { createdAt: desc }, limit: $limit, offset: $offset) { id createdAt updatedAt status { id title } profile { id createdAt updatedAt firstName lastName headline profileUrl } } profiles_associations_aggregate(where: { projectId: { _eq: $projectId } }) { aggregate { count } } }",
          "variables": {
            "projectId": "{{ _.showcase_recruiter_webapp_saas_project_uuid }}",
            "limit": 100,
            "offset": 0
          }
        }
    headers:
      - name: User-Agent
        value: insomnia/11.2.0
      - name: Content-Type
        value: application/json
    authentication:
