name: commit-check

# Vérifie que les commits de la PR respectent Conventional Commits (cf. git-workflow.md).
# Doublon volontaire du hook lefthook local : la CI reste l'autorité.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {} # lançable manuellement (valide alors le dernier commit)

concurrency:
  group: commit-check-${{ github.ref }}
  cancel-in-progress: true

# commitlint-github-action liste les commits de la PR via l'API : besoin de pull-requests:read
# (sinon "Resource not accessible by integration" → liste undefined → erreur .map).
permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: commitlint — Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (historique complet pour analyser la plage de commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
