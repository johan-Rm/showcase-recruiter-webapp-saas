security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Casquettes showcase-recruiter-webapp-saas (cumulables sur un même Person). Les accès admin cross-tenant restent explicites dans les voters.
    role_hierarchy:
        ROLE_COMPANY_OWNER: [ROLE_COMPANY_MEMBER]
        ROLE_ADMIN_OWNER: [ROLE_ADMIN_MEMBER]
        ROLE_ADMIN_MEMBER: [ROLE_ADMIN]

    providers:
        # Entity provider : authentification sur App\Entity\User par email (tâche 002).
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Connexion : POST /v1/auth/login → JWT (LexikJWT) — route api_login_check.
        login:
            pattern: ^/v1/auth/login$
            stateless: true
            # Une entreprise refusée suspend ses recruteurs : le checker le vérifie à la connexion,
            # au rafraîchissement et sur chaque requête portant un jeton (cf. SuspendedAccountChecker).
            user_checker: App\Security\SuspendedAccountChecker
            json_login:
                check_path: /v1/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Rafraîchissement : POST /v1/auth/refresh (Gesdinet).
        refresh:
            pattern: ^/v1/auth/refresh$
            stateless: true
            user_checker: App\Security\SuspendedAccountChecker
            refresh_jwt:
                check_path: /v1/auth/refresh

        # API : tout le reste sous /v1 est protégé par JWT.
        api:
            pattern: ^/v1
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\SuspendedAccountChecker
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    # Note : seule la *première* règle correspondante s'applique.
    access_control:
        - { path: ^/v1/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/magic-link/request$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/social/magic-link$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/magic-link/consume$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/password-setup/consume$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/password-reset/request$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/password-reset/consume$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/v1/health$, roles: PUBLIC_ACCESS }
        - { path: ^/v1/docs, roles: PUBLIC_ACCESS }
        - { path: ^/v1/contexts, roles: PUBLIC_ACCESS }
        # Référentiels & config en lecture publique (tâche 003).
        - { path: ^/v1/config$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/v1/validation-rules/[^/]+$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/v1/languages$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/v1/category-codes$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/v1/sectors$, methods: [GET], roles: PUBLIC_ACCESS }
        # Acceptation d'invitation par token : parcours public, crée le compte membre (tâche 009).
        - { path: '^/v1/invitations/[^/]+$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/v1/invitations/[^/]+/accept$', methods: [POST], roles: PUBLIC_ACCESS }
        # Inscription candidat : parcours public, crée le compte + la projection (tâche 015).
        - { path: '^/v1/candidates/onboarding$', methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/v1$, roles: PUBLIC_ACCESS }
        - { path: ^/v1, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
