    # libellé, accordé sur un compte qu'elles n'affichent pas.
    seen: vu | vus
    noKeywords: pas de mots clés
    # « retenus » et non « favoris » : le mot dit le GESTE du recruteur là où « favori » dit un
    # goût. Arbitré en ENT-050 pour cette carte seulement — la Table et la Visionneuse disent
    # encore « Favoris » jusqu'à ce qu'on les touche.
    retained: retenu | retenus
    retainedByTeam: '{count} retenu par l’équipe | {count} retenus par l’équipe'
    closed: close
    closedOn: close le {date} par {name}
  # UN CONSEIL, JAMAIS UN REPROCHE (task ENT-131). Le nombre exact y figure : c'est lui qui rend
  # l'avertissement crédible, et qui explique qu'il apparaisse ici et pas ailleurs. `short` est la
  # forme de la carte de collection, où la place est comptée ; le reste s'affiche à l'ouverture.
