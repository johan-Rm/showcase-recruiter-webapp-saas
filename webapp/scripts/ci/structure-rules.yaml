  - name: layouts-root-marker
    readme: base/app/layouts/README.md — « Marqueurs structurels »
    scope:
      - spaces/entreprise/app/layouts/cockpit.vue
    check: layouts-root-marker
    message: La racine d'un layout porte data-layout avec le nom dérivé de son chemin.

  - name: structure-section-semantics
    readme: base/app/pages/README.md — « Marqueurs structurels »
    scope:
      - spaces/entreprise/app/layouts/cockpit.vue
      - spaces/entreprise/app/pages/index.vue
      - spaces/entreprise/app/pages/credits.vue
      - spaces/entreprise/app/pages/l-entreprise.vue
