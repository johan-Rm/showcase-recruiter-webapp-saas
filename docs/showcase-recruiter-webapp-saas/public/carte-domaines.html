<!DOCTYPE html>

<head>

<title>showcase-recruiter-webapp-saas — Carte des domaines</title>
<!-- Aucune police distante : la doc est servie en statique, et une requête vers un tiers à chaque
     affichage dégraderait la page hors ligne. Les fontes de marque sont Sora (titres) et Geist
     (interface) ; à défaut, la pile système prend le relais sans casser la mise en page. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Geist', system-ui, sans-serif;
    background: #f8f6f0;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: clamp(0.75rem, 2.5vh, 1.75rem) clamp(1rem, 3vw, 2.5rem);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap; flex: 0 0 auto;
  }
  .brand {
    font-family: 'Sora', system-ui, sans-serif; font-weight: 300;
    font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: 0.05em; color: #0d0d0d; line-height: 1;
  }
  .brand em { font-style: italic; color: #dc8260; }
  .brand .sub { font-family: 'Geist', system-ui, sans-serif; font-size: 0.85rem; color: #8b8578; margin-left: 0.55rem; letter-spacing: 0; }
  .hint { font-size: 0.8rem; color: #9a8f7c; }

  .stage { flex: 1; min-height: 0; display: grid; place-items: center; }
  svg { width: 100%; height: 100%; max-height: 100%; }

  /* Texte SVG */
  .dom  { font: 700 15px 'Geist', ui-monospace, monospace; fill: #0d0d0d; }
  .app  { font: 600 13.5px 'Geist', system-ui, sans-serif; }
  .role { font: 400 11px 'Geist', system-ui, sans-serif; fill: #6b6f7e; }
  .cat  { font: 600 11px 'Geist', system-ui, sans-serif; letter-spacing: 0.15em; fill: #b3a88f; }
  .hubname  { font: 700 17px 'Geist', system-ui, sans-serif; fill: #0d0d0d; }
  .hubsub   { font: 400 10.5px 'Geist', system-ui, sans-serif; fill: #8b8578; }
  .hubbrand { font: italic 300 13px 'Sora', system-ui, sans-serif; fill: #dc8260; letter-spacing: 0.14em; }
  .foot { font: 400 11px 'Geist', system-ui, sans-serif; fill: #9a8f7c; }

  .node { transition: transform 200ms ease; transform-box: fill-box; transform-origin: center; }
  .node:hover { transform: translateY(-3px); }

  @media print { body { overflow: visible; height: auto; } }
</style>
</head>
